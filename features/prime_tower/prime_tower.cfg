# Detect all first-layer extrusion so adaptive mesh and KAMP can reserve
# models, brims, skirts, supports, and prime towers before the print starts.
[prime_tower]
# Extra clearance around the path centerline, in millimeters.
padding: 0.5
# Minimum wait before continuing without first-layer geometry.
scan_timeout: 120.0
# Larger files receive at least this many seconds per MiB. This keeps a
# complex first layer from losing geometry only because its G-code is large.
scan_timeout_per_mb: 10.0
