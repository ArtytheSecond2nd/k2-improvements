# Firmware 1.1.3.13 stock macros call this command even though that firmware
# does not register a handler for it. The surrounding M141/M191/END_PRINT
# macros already set the chamber-fan target and output pin, so retaining the
# missing call as a no-op removes false errors without changing fan behavior.
[gcode_macro SET_TEMPERATURE_FAN_SWITCH]
description: Compatibility no-op for a missing K2 Plus 1.1.3.13 command
gcode:
    G4 P0
