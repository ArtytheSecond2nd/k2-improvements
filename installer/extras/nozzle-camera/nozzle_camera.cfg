[gcode_shell_command nozzle_camera_on]
command: /mnt/UDISK/bin/nozzle-camera.sh on
timeout: 45.0
verbose: True

[gcode_shell_command nozzle_camera_off]
command: /mnt/UDISK/bin/nozzle-camera.sh off
timeout: 10.0
verbose: True

[gcode_shell_command nozzle_camera_status]
command: /mnt/UDISK/bin/nozzle-camera.sh status
timeout: 5.0
verbose: True

[gcode_macro NOZZLE_CAM_ON]
description: Power the stock nozzle camera and start its stream
gcode:
    RUN_SHELL_COMMAND CMD=nozzle_camera_on
    UPDATE_DELAYED_GCODE ID=_NOZZLE_CAMERA_AUTO_OFF DURATION=600

[gcode_macro NOZZLE_CAM_OFF]
description: Stop the stock nozzle-camera stream and power it down
gcode:
    UPDATE_DELAYED_GCODE ID=_NOZZLE_CAMERA_AUTO_OFF DURATION=0
    RUN_SHELL_COMMAND CMD=nozzle_camera_off

[gcode_macro NOZZLE_CAM_STATUS]
description: Report whether the stock nozzle-camera stream is running
gcode:
    RUN_SHELL_COMMAND CMD=nozzle_camera_status

[delayed_gcode _NOZZLE_CAMERA_AUTO_OFF]
gcode:
    RUN_SHELL_COMMAND CMD=nozzle_camera_off
